<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📱 Admin Controller</title>
    <style>
        body {
            background-color: #1a1a24; color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex; flex-direction: column; align-items: center;
            padding: 20px;
        }
        .panel {
            background: rgba(255,255,255,0.05); padding: 25px;
            border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
            width: 100%; max-width: 400px;
        }
        h2 { text-align: center; color: #00e5ff; margin-top: 0; }
        input {
            width: 95%; padding: 12px; margin-bottom: 20px;
            background: #0d0d11; border: 1px solid #555; color: white;
            border-radius: 8px; font-size: 16px; outline: none;
        }
        input:focus { border-color: #00e5ff; }
        button {
            width: 100%; padding: 15px; margin-bottom: 10px;
            border: none; border-radius: 8px; font-size: 16px; font-weight: bold;
            cursor: pointer; transition: 0.2s; color: white;
        }
        button:active { transform: scale(0.95); }
        .btn-l { background: #3f51b5; } .btn-l:hover { background: #5c6bc0; }
        .btn-b { background: #9c27b0; } .btn-b:hover { background: #ab47bc; }
        .btn-legendary { background: #ff9800; color: #000; } .btn-legendary:hover { background: #ffb74d; }
        .btn-nuke { background: #d32f2f; margin-top: 20px; border: 2px solid #ff5252; box-shadow: 0 0 10px red; } .btn-nuke:hover { background: #f44336; }
        .btn-clear { background: #555; margin-top: 10px; } .btn-clear:hover { background: #777; }
    </style>
</head>
<body>

    <div class="panel">
        <h2>🎮 BẢNG ĐIỀU KHIỂN BOSS</h2>
        <p style="font-size: 14px; color: #aaa; text-align:center;">
            (Nhập tên người chơi muốn Cheat và bấm nút. Lệnh sẽ bắn thẳng sang tab game bên kia)
        </p>

        <label>Tên Người Chơi (hoặc tên Boss tự tạo):</label>
        <input type="text" id="pName" placeholder="VD: Erica" value="Erica">

        <button class="btn-l" onclick="sendCommand('gift', 1)">Thả Bi Nhỏ (1 Xu)</button>
        <button class="btn-l" onclick="sendCommand('gift', 5)">Thả Bi Vừa (5 Xu)</button>
        <button class="btn-b" onclick="sendCommand('gift', 20)">😈 Thả Bi Lớn (20 Xu)</button>
        <button class="btn-b" onclick="sendCommand('gift', 30)">😈 Thả Bi Cực Lớn (30 Xu)</button>
        <button class="btn-legendary" onclick="sendCommand('gift', 100)">👑 THẢ BOSS HUYỀN THOẠI (100 Xu)</button>

        <button class="btn-nuke" onclick="sendCommand('gift', 200)">🚀 BOOM NGUYÊN TỬ (-90% Máu) (200 Xu)</button>

        <button class="btn-l" style="background:#00c853;" onclick="sendCommand('like', 0)">💖 Buff tốc độ & Hồi máu</button>
        
        <button class="btn-clear" onclick="sendCommand('reset', 0)">🧨 CLEAR MAP (XÓA SẠCH BI)</button>
    </div>

<script>
    function sendCommand(actionType, value) {
        const playerName = document.getElementById('pName').value.trim() || "Admin";
        
        const payload = {
            id: Date.now(),
            playerName: playerName,
            type: actionType,
            value: value
        };

        localStorage.setItem('admin_cheat_command', JSON.stringify(payload));
        
        document.body.style.backgroundColor = actionType === 'gift' && value === 200 ? "#4a0000" : "#2a4d2c";
        setTimeout(() => document.body.style.backgroundColor = "#1a1a24", 200);
    }
</script>
</body>
</html>
