<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ball V3</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #0d0d11; font-family: sans-serif; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize); resize();

    let marbles = []; let effects = [];

    function stringToColor(str) {
        let hash = 0; for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
        let color = '#'; for (let i = 0; i < 3; i++) color += ('00' + ((hash >> (i * 8)) & 0xFF).toString(16)).substr(-2);
        return color;
    }

    class VisualEffect {
        constructor(x, y, color, type) {
            this.x = x; this.y = y; this.color = color; this.type = type; this.alpha = 1;
            if (type === 'explosion') { this.radius = Math.random() * 4 + 2; this.vx = (Math.random() - 0.5) * 12; this.vy = (Math.random() - 0.5) * 12; this.decay = 0.02; } 
            else if (type === 'spark') { this.radius = Math.random() * 2 + 1; this.vx = (Math.random() - 0.5) * 8; this.vy = (Math.random() - 0.5) * 8; this.decay = 0.05; } 
            else if (type === 'heal') { this.vx = 0; this.vy = -1 - Math.random(); this.decay = 0.02; }
        }
        draw(ctx) {
            ctx.save(); ctx.globalAlpha = Math.max(0, this.alpha);
            if (this.type === 'heal') { ctx.fillStyle = "#00ff00"; ctx.font = "bold 16px sans-serif"; ctx.shadowColor = "#00ff00"; ctx.shadowBlur = 5; ctx.fillText("+", this.x, this.y); } 
            else { ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fillStyle = this.color; ctx.fill(); }
            ctx.restore();
        }
        update() { this.x += this.vx; this.y += this.vy; this.alpha -= this.decay; }
    }

    class Marble {
        constructor(name, coinValue) {
            this.name = name; this.color = stringToColor(name);
            if (coinValue >= 100) { this.radius = 55; this.maxHp = 1200; this.mass = 120; } 
            else if (coinValue >= 50) { this.radius = 38; this.maxHp = 600; this.mass = 50; } 
            else if (coinValue >= 5) { this.radius = 24; this.maxHp = 250; this.mass = 20; } 
            else { this.radius = 14; this.maxHp = 100; this.mass = 10; }
            this.hp = this.maxHp; this.x = Math.random() * (canvas.width - 200) + 100; this.y = -this.radius - 20;
            this.vx = (Math.random() - 0.5) * 6; this.vy = Math.random() * 4 + 2; this.angle = 0; 
        }
        draw(ctx) {
            ctx.save(); ctx.shadowColor = this.color; ctx.shadowBlur = 15;
            if (this.mass >= 120) {
                this.angle += 0.02; ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.angle); ctx.strokeStyle = "#ffd700"; ctx.lineWidth = 3; ctx.setLineDash([10, 15]); ctx.beginPath(); ctx.arc(0, 0, this.radius + 8, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
            }
            ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fillStyle = this.color; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = this.mass >= 120 ? '#ffd700' : '#ffffff'; ctx.stroke(); ctx.restore(); 
            ctx.fillStyle = "#ffffff"; ctx.font = "bold 12px sans-serif"; ctx.textAlign = "center"; ctx.shadowColor = "black"; ctx.shadowBlur = 4; ctx.fillText(this.name, this.x, this.y - this.radius - 14);
            let hpBarW = Math.max(this.radius * 2, 30); let hpPercent = Math.max(0, this.hp / this.maxHp);
            ctx.fillStyle = "rgba(255, 0, 0, 0.7)"; ctx.fillRect(this.x - hpBarW / 2, this.y - this.radius - 8, hpBarW, 5);
            ctx.fillStyle = "#00e676"; ctx.fillRect(this.x - hpBarW / 2, this.y - this.radius - 8, hpBarW * hpPercent, 5);
            if (this.mass >= 120) { ctx.font = "16px sans-serif"; ctx.fillText("👑", this.x, this.y - this.radius - 28); }
        }
        update() {
            this.vx += (canvas.width / 2 - this.x) * 0.00004; this.vy += (canvas.height / 2 - this.y) * 0.00004;
            this.vx *= 1; this.vy *= 1; this.x += this.vx; this.y += this.vy;
            if (this.x - this.radius < 0) { this.x = this.radius; this.vx *= -0.8; }
            if (this.x + this.radius > canvas.width) { this.x = canvas.width - this.radius; this.vx *= -0.8; }
            if (this.y - this.radius < 0) { this.y = this.radius; this.vy *= -0.8; }
            if (this.y + this.radius > canvas.height) { this.y = canvas.height - this.radius; this.vy *= -0.8; }
        }
    }

    function createVFX(x, y, color, type, count = 10) {
        for (let i = 0; i < count; i++) effects.push(new VisualEffect(x + (Math.random() - 0.5) * 10, y + (Math.random() - 0.5) * 10, color, type));
    }

    function handleAction(playerName, type, value) {
        if (type === 'gift') {
            marbles.forEach(m => { if (m.name === playerName && m.hp < m.maxHp) { m.hp = m.maxHp; createVFX(m.x, m.y - m.radius, '#00ff00', 'heal', 5); } });
            let remain = value;
            while (remain >= 100) { marbles.push(new Marble(playerName, 100)); remain -= 100; }
            if (remain > 0) marbles.push(new Marble(playerName, remain));
        } else if (type === 'like') {
            marbles.forEach(m => { if (m.name === playerName) { if(m.hp < m.maxHp) createVFX(m.x, m.y - m.radius, '#00ff00', 'heal', 3); m.hp = Math.min(m.maxHp, m.hp + (m.maxHp * 0.15)); m.vx += (Math.random() - 0.5) * 12; m.vy += (Math.random() - 0.5) * 12; } });
        } else if (type === 'reset') {
            marbles = []; effects = []; // Lệnh reset từ admin
        }
    }

    function resolveCollision() {
        for (let i = 0; i < marbles.length; i++) {
            for (let j = i + 1; j < marbles.length; j++) {
                let m1 = marbles[i], m2 = marbles[j];
                if (m1.name === m2.name) continue;
                let dx = m2.x - m1.x, dy = m2.y - m1.y, dist = Math.hypot(dx, dy), minDist = m1.radius + m2.radius;
                if (dist < minDist) {
                    let overlap = minDist - dist, nx = dx / dist, ny = dy / dist, totalMass = m1.mass + m2.mass;
                    let r1 = m2.mass / totalMass, r2 = m1.mass / totalMass;
                    m1.x -= nx * overlap * r1; m1.y -= ny * overlap * r1; m2.x += nx * overlap * r2; m2.y += ny * overlap * r2;
                    m1.hp -= m2.mass * 0.08; m2.hp -= m1.mass * 0.08;
                    createVFX(m1.x + nx * m1.radius, m1.y + ny * m1.radius, '#ffeb3b', 'spark', 3);
                    m1.vx -= nx * r1 * 3; m1.vy -= ny * r1 * 3; m2.vx += nx * r2 * 3; m2.vy += ny * r2 * 3;
                }
            }
        }
    }

    function gameLoop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        marbles.forEach(m => { m.update(); m.draw(ctx); });
        effects.forEach((e, index) => { e.update(); e.draw(ctx); if (e.alpha <= 0) effects.splice(index, 1); });
        resolveCollision();
        marbles.forEach(m => { if (m.hp <= 0) createVFX(m.x, m.y, m.color, 'explosion', m.mass >= 120 ? 40 : 15); });
        marbles = marbles.filter(m => m.hp > 0);
        requestAnimationFrame(gameLoop);
    }
    gameLoop();

    // ==========================================
    // 1. NGHE LỆNH BÍ MẬT TỪ TRANG ADMIN.HTML
    // ==========================================
    window.addEventListener('storage', (event) => {
        if (event.key === 'admin_cheat_command') {
            const data = JSON.parse(event.newValue);
            handleAction(data.playerName, data.type, data.value);
            console.log("🤫 Nhận lệnh Cheat:", data);
        }
    });

    // ==========================================
    // 2. KẾT NỐI TIKFINITY WEBSOCKET 
    // ==========================================
    const TIKFINITY_WS_URL = "ws://localhost:21213"; 
    function connectTikFinity() {
        const ws = new WebSocket(TIKFINITY_WS_URL);
        ws.onopen = () => { createVFX(canvas.width/2, canvas.height/2, '#00ff00', 'heal', 20); };
        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            const eventType = data.event || data.type;
            if (!eventType) return;
            if (eventType === 'gift') {
                handleAction(data.nickname || data.uniqueId || "Người Ẩn Danh", 'gift', data.diamondCount || data.coinValue || data.cost || 1);
            }
            if (eventType === 'like') {
                handleAction(data.nickname || data.uniqueId || "Người Ẩn Danh", 'like', 0);
            }
        };
        ws.onclose = () => { setTimeout(connectTikFinity, 5000); };
    }
    connectTikFinity();
</script>
</body>
</html>
